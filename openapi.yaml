                display_name: { type: string }
                context_window: { type: integer }
                max_output: { type: integer }
                input_cost: { type: number }
                output_cost: { type: number }
                reasoning: { type: boolean }
                tool_call: { type: boolean }
                attachment: { type: boolean }
      responses:
        '201': { description: created }
        '400': { description: provider_id and model_id required }
  /api/provider-models/{id}:
    put:
      summary: Update a manual provider model (admin only, audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ProviderModel fields to persist
      responses:
        '200': { description: ok }
        '400': { description: invalid json }
        '500': { description: update failed }
    delete:
      summary: Delete a provider model (admin only, audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: deleted }
  /api/provider-models/{id}/enrich:
    post:
      summary: Enrich a provider model from the models.dev catalog (admin only)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: enriched }
        '500': { description: enrichment failed }
  /api/providers/{id}/discover:
    post:
      summary: Run model discovery against one provider's /models endpoint (admin only, audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: discovered model ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  discovered: { type: array, items: { type: string } }
        '404': { description: provider not found }
  /api/oauth/providers:
    get:
      summary: List registered OAuth provider definitions (generic registry)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: oauth definitions }
  /api/oauth/start:
    post:
      summary: Start OAuth login (returns browser auth_url + single-use state)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: auth_url + state + provider_id }
  /api/oauth/exchange:
    post:
      summary: Complete paste-mode OAuth (pasted localhost callback URL)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: connected }
  /api/oauth/callback:
    get:
      summary: Server-mode OAuth redirect for custom OAuth apps (public, state is the capability)
      tags: [admin]
      responses:
        '302': { description: redirect to /providers }
  /api/providers/{id}/oauth/status:
    get:
      summary: OAuth connection status for a provider
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: connected + email + project }
  /api/providers/{id}/oauth/refresh:
    post:
      summary: Force OAuth token refresh
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: refreshed }
  /api/providers/{id}/oauth/usage:
    get:
      summary: OAuth subscription usage/limits for a connected provider
      description: Antigravity returns plan_type, prompt_credits and per-model remaining quota; Devin returns plan plus daily/weekly used/remaining and extra balance.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: usage snapshot (shape varies by provider) }
        '400': { description: oauth not connected or unsupported provider }
        '404': { description: provider not found }
        '502': { description: upstream quota fetch failed }
  /api/providers/{id}/oauth:
    delete:
      summary: Disconnect OAuth (clears stored tokens)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: disconnected }
  /api/discover-all:
    post:
      summary: Run discovery across all providers (admin only, audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: discovery report }
  /api/stats:
    get:
      summary: Aggregate usage stats; optional range for time-series breakdowns
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: range
          in: query
          required: false
          schema: { type: string, example: 7d }
      responses:
        '200':
          description: |
            Aggregates. Range responses add `daily` buckets (each with
            `cache_hits` — gateway response-cache hits in the bucket),
            `range_cache_hits` (gateway X-Cache: HIT count for the range),
            `range_cache_eligible` (hit + miss count), `range_cache_bypassed`
            (requests that never consult the cache) and
            `gateway_cache_hit_rate` (hits / eligible requests), alongside
            the prompt-cache fields `cache_hit_rate` / `cache_read_tokens`.
            Log rows carry `cache_status`: hit | miss | bypass.
  /api/logs:
    get:
      summary: Request logs with pagination and filters (default latest 100)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: model
          in: query
          schema: { type: string }
          description: substring match on the model column
        - name: key
          in: query
          schema: { type: string }
          description: key-prefix prefix match
        - name: endpoint
          in: query
          schema: { type: string }
          description: substring match on the endpoint column
        - name: status
          in: query
          schema: { type: string }
          description: exact HTTP code, or "failed" (status >= 400)
        - name: since
          in: query
          schema: { type: string }
          description: RFC3339 timestamp or Go duration (e.g. "24h")
        - name: key_id
          in: query
          schema: { type: string }
          description: exact gateway key id (the per-key analytics attribution column)
        - name: provider_id
          in: query
          schema: { type: string }
          description: exact provider id
        - name: stream
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: filter to streaming or non-streaming requests
        - name: min_latency_ms
          in: query
          schema: { type: integer }
        - name: max_latency_ms
          in: query
          schema: { type: integer }
        - name: has_error
          in: query
          schema: { type: string, enum: ['true'] }
        - name: q
          in: query
          schema: { type: string }
          description: server-side search over model, endpoint and error text (case-insensitive)
        - name: search_bodies
          in: query
          schema: { type: string, enum: ['true'] }
          description: opt-in — extend q search to stored request/response bodies (expensive)
      responses:
        '200':
          description: log rows (array) — total matching count in X-Total-Count
          headers:
            X-Total-Count:
              schema: { type: integer }
              description: total rows matching the filters, independent of limit/offset
  /api/logs/{id}:
    get:
      summary: Single request log incl. stored bodies (org-scoped)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: log detail }
        '404': { description: not found }
  /api/logs/group:
    get:
      summary: Group-by reporting rollup over the /api/logs filter set
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: group_by
          in: query
          schema: { type: string, enum: [key, model, provider, endpoint, finish_reason, status, error], default: model }
        - name: range
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 7d }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: order
          in: query
          schema: { type: string, enum: [requests, cost, tokens], default: requests }
        - name: filters
          in: query
          description: all /api/logs filter params are honored (model, key_id, provider_id, status, stream, has_error, q, …)
          schema: { type: object }
      responses:
        '200':
          description: one row per group with requests, tokens, cost, failed, avg/p50/p95 latency_ms
        '400': { description: unknown group_by }
  /api/logs/export:
    get:
      summary: Download the filtered log set as CSV
      description: 'Streams text/csv with the same filters as /api/logs; capped at 50,000 rows (X-Truncated: true when hit).'
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filters
          in: query
          description: all /api/logs filter params are honored
          schema: { type: object }
      responses:
        '200':
          description: text/csv attachment with columns id, key_prefix, key_id, provider_id, model, endpoint, status, latency_ms, ttft_ms, created_at, prompt_tokens, completion_tokens, total_tokens, cost_usd, is_stream, finish_reason, error
  /api/admin/users/{id}/permissions:
    get:
      summary: Effective permissions + overrides for a user (users:read)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: effective (sorted permission list), overrides (permission → granted bool), catalog (all known permissions)
        '404': { description: unknown user }
    put:
      summary: Upsert permission overrides (users:write)
      description: |
        Body maps permission names to true (grant), false (revoke) or null
        (clear the override; role default applies). Unknown permissions are
        rejected with 400. Changes apply live — no re-login required.
        Admin users are fixed (400): admins always allow everything.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: boolean
                nullable: true
              example: { "keys:read_own": true, "keys:create": false, "audit:read": null }
      responses:
        '200': { description: updated — returns the recomputed effective set }
        '400': { description: unknown permission or admin target }
        '403': { description: missing users:write }
  /api/audit:
    get:
      summary: Audit trail (admin only)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: actor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: audit rows, newest first — total in X-Total-Count
          headers:
            X-Total-Count:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    actor: { type: string }
                    action: { type: string, example: post }
                    target_type: { type: string, example: provider }
                    target_id: { type: string }
                    meta: { type: string }
                    created_at: { type: string, format: date-time }
  /api/billing/export:
    get:
      summary: Billing export as CSV (attachment) over a lookback window; emits a billing.export webhook
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [24h, 7d, 30d], default: 7d }
      responses:
        '200':
          description: CSV rows
          content:
            text/csv:
              schema: { type: string }
  /api/lb/rules:
    get:
      summary: List load-balancer routing rules (admin)
      description: |
        Each rule maps a model name to an ORDERED group of (provider, model)
        options. A provider may appear multiple times with different
        model_override values. Rotation happens across requests (round-robin
        by position); failover rules walk options in position order on
        retriable failures. Qualified model IDs ("provider/model") and
        X-Provider headers bypass rules.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rules with ordered members (joined provider metadata)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LBRule' }
  /api/lb/rules/{model}:
    put:
      summary: Create or replace the option group for a model (admin)
      description: |
        Accepts the rich member form (`members`: provider + optional
        per-member `model_override` + `weight`, with `strategy` one of
        round_robin | random | weighted | failover) or the legacy bare-id
        list (`providers`). The same provider may be listed multiple times
        with distinct model overrides; exact duplicate (provider, model)
        pairs are rejected with 400.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string, maxLength: 256, example: gpt-4o-mini }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy:
                  type: string
                  enum: [round_robin, random, weighted, failover]
                  default: round_robin
                quota_threshold_pct:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 90
                  nullable: true
                  description: Consumed OAuth subscription quota percentage at which a member is skipped.
                members:
                  type: array
                  maxItems: 50
                  minItems: 1
                  items:
                    type: object
                    required: [provider_id]
                    properties:
                      provider_id: { type: string }
                      model_override:
                        type: string
                        maxLength: 256
                        description: Model id sent upstream for this option ("" = the rule's model name)
                      weight:
                        type: integer
                        minimum: 1
                        maximum: 100
                        description: Relative traffic share (weighted strategy; ignored otherwise)
                providers:
                  type: array
                  maxItems: 50
                  minItems: 1
                  items: { type: string }
                  description: 'Legacy form: provider IDs in order (round_robin, no overrides)'
      responses:
        '201': { $ref: '#/components/responses/LBRuleSaved' }
        '400': { description: 'Unknown provider, duplicate (provider, model) option, or invalid body' }
        '403': { description: Org-scoped caller referencing another org's provider }
    delete:
      summary: Delete the routing rule for a model (admin)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: model
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
  # ── Centralized MCP ───────────────────────────────────────────────────────
  /mcp:
    post:
      summary: Unified MCP endpoint — one MCP server for every harness
      description: |
        Streamable HTTP MCP transport (JSON-RPC 2.0). Register MCP servers once in
        the dashboard (Connect → MCP Servers); harnesses (Pi, OpenCode, Claude
        Code, Cursor) point their MCP client here instead of configuring each
        upstream server separately.

        The gateway owns the upstream connections (Streamable HTTP, legacy SSE or
        a locally launched stdio process), discovers their tools and exposes them
        namespaced as `<server-slug>-<tool-name>` so tools from different servers
        never collide. Tool calls are routed back to the owning server.

        **Authentication.** A gateway key is required. Because MCP clients reserve
        `Authorization` for upstream OAuth, the preferred header is
        `x-litellm-api-key: Bearer sk-gw-…`; `Authorization: Bearer sk-gw-…` and
        `x-api-key` are also accepted. The same budget and rate-limit middleware
        as `/v1` applies, so a key cannot bypass spend controls here.

        **Authorization.** Only servers and tools granted to the key appear. A key
        with no grants sees every enabled server; granting at least one switches
        it to an explicit allowlist (`GET`/`PUT /api/keys/{id}/mcp`).

        **Browser navigations** (`Accept: text/html`) to this path serve the
        dashboard's MCP Servers screen; API and MCP requests get the protocol.

        See [docs/mcp.md](https://github.com/karutoil/ai-gateway/blob/main/docs/mcp.md).
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request (initialize, tools/list, tools/call, …).
              additionalProperties: true
      responses:
        '200':
          description: JSON-RPC response, or an SSE stream when the client accepts text/event-stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '401': { description: 'Missing or invalid gateway key (JSON-RPC error envelope)' }
    get:
      summary: Standalone server→client SSE stream (Streamable HTTP)
      description: |
        With `Accept: text/html` (a browser navigation) this path serves the
        dashboard instead of the protocol.
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      responses:
        '200': { description: SSE stream, or the dashboard HTML for a navigation }
    delete:
      summary: Terminate an MCP session
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session closed }
  /{server}/mcp:
    post:
      summary: MCP endpoint scoped to one server (path selection)
      description: |
        Same protocol as `/mcp`, restricted to the named server. Path selection
        only NARROWS access — it can never grant a tool the key was not already
        given. Naming a server the key cannot use answers `404` with a JSON-RPC
        error rather than an empty tool list.
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: string }
          description: Server slug (or display name). A comma-separated list selects several.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: JSON-RPC response or SSE stream }
        '404': { description: 'Server is not registered or not authorized for this key' }
  /v1/mcp/server:
    get:
      summary: List the MCP servers a key may use
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      responses:
        '200':
          description: Authorized servers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    server_id: { type: string }
                    server_name: { type: string, description: Tool namespace prefix }
                    name: { type: string }
                    transport: { type: string, enum: [http, sse, stdio] }
                    health_status: { type: string, enum: [up, down, unknown] }
                    tool_count: { type: integer }
  /mcp-rest/tools/list:
    get:
      summary: List the namespaced MCP tools a key may call
      description: Scripted access without an MCP client and without an LLM in the loop.
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      parameters:
        - name: server_id
          in: query
          required: false
          schema: { type: string }
          description: Filter to one server (id or slug).
      responses:
        '200':
          description: Tool catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        namespaced_name: { type: string }
                        server_id: { type: string }
                        server_name: { type: string }
                        description: { type: string }
                        input_schema: { type: object, additionalProperties: true }
                  message: { type: string }
  /mcp-rest/tools/call:
    post:
      summary: Execute one MCP tool directly
      tags: [mcp]
      security: [{ gatewayKey: [] }, { mcpKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_id, name]
              properties:
                server_id: { type: string, description: Server id or slug }
                name: { type: string, description: Tool name or namespaced name }
                arguments: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Tool result
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_id: { type: string }
                  server_name: { type: string }
                  tool: { type: string }
                  is_error: { type: boolean }
                  content: { type: array, items: { type: object, additionalProperties: true } }
                  text: { type: string }
                  duration_ms: { type: integer }
        '403': { description: 'Tool is not available to this key on that server' }
        '502': { description: 'The upstream MCP server failed' }
components:
  responses:
    LBRuleSaved:
      description: Saved rule with joined member metadata
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LBRule' }
  securitySchemes:
    mcpKey:
      type: apiKey
      in: header
      name: x-litellm-api-key
      description: |
        Gateway key for MCP clients. MCP reserves `Authorization` for upstream
        OAuth, so the LiteLLM convention is used here. Send `Bearer sk-gw-…`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Gateway key as `Authorization: Bearer sk-gw-...` — `x-api-key: sk-gw-...` is accepted equivalently'
    cookieAuth:
      type: apiKey
      in: cookie
      name: gw_token
      description: 'HttpOnly dashboard session cookie (set by /api/auth/login, /api/auth/oidc and the passkey flows). Accepted on /api/* in place of the Bearer JWT for dashboard-origin calls; cross-site mutations must pass the CSRF origin check.'
  schemas:
    LBRule:
      type: object
      required: [model, providers]
      properties:
        model:
          type: string
          example: gpt-4o-mini
        strategy:
          type: string
          enum: [round_robin, random, weighted, failover]
        quota_threshold_pct:
          type: integer
          minimum: 1
          maximum: 100
          default: 90
          nullable: true
          description: Consumed OAuth subscription quota percentage at which a member is skipped.
        providers:
          type: array
          description: Ordered options; a provider may repeat with distinct model_override values
          items:
            type: object
            properties:
              provider_id: { type: string }
              name: { type: string, example: openai }
              type: { type: string, example: openai }
              model_override:
                type: string
                description: Model id sent upstream for this option (absent = the rule's model)
              weight: { type: integer, minimum: 1, maximum: 100 }
              health_status: { type: string, nullable: true, enum: [up, down, unknown, ""] }
    CreateProvider:
      type: object
      required: [name, type]
      properties:
        name: { type: string, example: openai }
        type: { type: string, enum: [openai, anthropic, azure, openai_compatible, antigravity, devin, systemone, cloudflare, google, xai], example: openai }
        base_url: { type: string, example: https://api.openai.com/v1 }
        api_key: { type: string, example: sk-... , description: 'Required for every provider type except antigravity and devin (OAuth flows) and systemone (a local llama.cpp / Kev server may use an empty key). A systemone provider may set an empty key; cloudflare and google do require one.'}
    CreateKey:
      type: object
      description: All fields optional except none — a key with no name gets key-<uuid8>.
      properties:
        name:
          type: string
          maxLength: 64
          example: my-key
        org_id:
          type: string
          description: Optional org scope; non-admin callers may only scope to their own org
        rate_limit_rpm: { type: integer, example: 60 }
        rate_limit_rph: { type: integer, example: 1000 }
        rate_limit_rpd: { type: integer, example: 10000 }
        rate_limit_tpm: { type: integer, example: 50000 }
        allowed_models:
          type: array
          maxItems: 100
          items: { type: string }
          description: Allowlist with * wildcard; empty = all models

    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      description: |
        OpenAI Images generation request. Unknown `size` values are rejected
        locally with `400 invalid_request_error`; `quality`, `style`,
        `aspect_ratio` and `resolution` are **not** validated by the gateway —
        they are passed through to the provider, so provider-specific values
        work. Reference images (`image` / `images`) are inlined JSON, not files:
        a data URL, a bare base64 string, or an object. Remote http(s) URLs are
        rejected because the gateway does not fetch user URLs server-side.
      properties:
        model: { type: string, example: gemini-2.5-flash-image, description: "Curated image model id (provider/model or bare)." }
        prompt: { type: string, description: Text prompt describing the desired image. Max 32000 bytes. }
        n: { type: integer, minimum: 1, maximum: 10, default: 1 }
        size:
          type: string
          enum: [auto, 256x256, 512x512, 1024x1024, 1536x1024, 1024x1536, 1792x1024, 1024x1792, 2048x2048, 2048x1152, 1152x2048, 4096x4096]
          default: auto
        quality: { type: string, description: 'Provider-specific quality tier; passed through unchanged to OpenAI-compatible upstreams (commonly low/medium/high/auto/hd/standard). Not validated by the gateway.' }
        style: { type: string, example: vivid, description: 'Provider-specific style; passed through unchanged. Not validated by the gateway.' }
        response_format: { type: string, enum: [b64_json, url], default: b64_json }
        aspect_ratio: { type: string, example: "16:9", description: 'Aspect ratio for providers that take one instead of pixel size (Gemini / Imagen / Grok); passed through unchanged.' }
        resolution: { type: string, description: 'Provider-specific resolution tier; passed through unchanged (commonly 1k or 2k). Not validated by the gateway.' }
        image:
          oneOf:
            - { type: string }
            - { type: object }
          description: 'Optional single reference image for image-to-image: data URL, bare base64, or an object with url/b64_json/data (+ optional mime_type/media_type). Remote http(s) URLs are rejected.'
        images:
          type: array
          maxItems: 4
          items:
            oneOf:
              - { type: string }
              - { type: object }
          description: 'Optional reference images for image-to-image generation (same element shapes as `image`). `image` plus `images` combined are capped at 4 files.'
    ImageEditRequest:
      type: object
      required: [model, prompt]
      description: |
        `multipart/form-data` edit request. Upload the source file(s) as the
        `image` part (repeat it) **or** as `images` parts; at most **4** source
        files. At least one is required — that is validated after parsing, so it
        is not marked `required` in the schema (the 400 is
        `image: at least one image file is required for edits`).

        Field naming differs from the OpenAI Images edit API, which keys on
        `image` / `image[]`: this gateway accepts `image` and the `images` alias.

        `size` is validated against the same value set as generation; `quality`,
        `style`, `aspect_ratio` and `resolution` are passed through unvalidated.
      properties:
        model: { type: string, example: gpt-image-1 }
        prompt: { type: string, description: Max 32000 bytes. }
        image:
          type: array
          maxItems: 4
          items: { type: string, format: binary }
          description: 'Source image file(s). Repeat the part to send several; at most 4. At least one image part (or `images`) is required.'
        images:
          type: array
          maxItems: 4
          items: { type: string, format: binary }
          description: 'Alias for `image`, for clients that upload an `images` array. `image` + `images` combined are capped at 4 files.'
        mask: { type: string, format: binary, description: Optional mask image (transparent areas are edited). }
        n: { type: integer, minimum: 1, maximum: 10, default: 1 }
        size:
          type: string
          enum: [auto, 256x256, 512x512, 1024x1024, 1536x1024, 1024x1536, 1792x1024, 1024x1792, 2048x2048, 2048x1152, 1152x2048, 4096x4096]
        quality: { type: string, description: 'Provider-specific quality tier; passed through unchanged. Not validated by the gateway.' }
        style: { type: string, description: 'Provider-specific style; passed through unchanged. Not validated by the gateway.' }
        response_format: { type: string, enum: [b64_json, url], default: b64_json }
        aspect_ratio: { type: string, example: "16:9", description: 'Passed through unchanged for providers that take one.' }
        resolution: { type: string, description: 'Provider-specific resolution tier; passed through unchanged. Not validated by the gateway.' }
    ImagesResponse:
      type: object
      properties:
        created: { type: integer, example: 1735689600 }
        model: { type: string, example: gemini-2.5-flash-image }
        data:
          type: array
          items: { $ref: '#/components/schemas/ImageDatum' }
        usage: { $ref: '#/components/schemas/ImageUsage' }
    ImageDatum:
      type: object
      properties:
        b64_json: { type: string, description: Base64-encoded image bytes (when response_format=b64_json). }
        url: { type: string, description: Image URL or data URI (when response_format=url). }
        mime_type: { type: string, example: image/png }
        revised_prompt: { type: string }
    ImageUsage:
      type: object
      properties:
        input_tokens: { type: integer, example: 9 }
        output_tokens: { type: integer, example: 1290 }
        total_tokens: { type: integer, example: 1299 }
    VideoCreateRequest:
      type: object
      required: [model, prompt]
      description: |
        Create an async video job. `seconds` and `size` are validated locally
        against the OpenAI Videos vocabulary; unknown values are rejected with
        `400` rather than forwarded (providers disagree on what an unsupported
        value means — some 400, some silently default).
      properties:
        model: { type: string, example: veo-3.1-generate-preview, description: "Curated video model id (provider/model or bare). An image-only model is rejected with a pointer to the images endpoint." }
        prompt: { type: string, description: Text prompt describing the desired video. Max 32000 bytes. }
        seconds:
          description: 'Clip length in seconds (4, 8 or 12). Both the string form "8" and the numeric form 8 are accepted; the job object always reports it as a string. Omitted -> "4".'
          oneOf:
            - { type: integer, enum: [4, 8, 12] }
            - { type: string, enum: ['4', '8', '12'] }
        size:
          type: string
          enum: [1280x720, 720x1280, 1024x1792, 1792x1024]
          description: 'Output resolution / orientation. Omitted -> 720x1280.'
        input_reference:
          description: 'Optional reference image for image-to-video. Accepts a data URL, a bare base64 string, or an object with url/b64_json/data (+ optional mime_type). A remote http(s) URL is forwarded verbatim for providers that fetch it (xAI); inline images are inlined into the provider body.'
          oneOf:
            - { type: string }
            - { type: object }
        remixed_from_video_id: { type: string, description: 'Remix/extend extension: the id of a previous job. Passed through where the provider supports it.' }
    Video:
      type: object
      description: |
        A video job. `completed_at`, `expires_at` and `error` are always present
        and are `null` until the corresponding state exists.
      properties:
        id: { type: string, example: video_abc123, description: 'Gateway-issued job id.' }
        object: { type: string, example: video }
        model: { type: string, example: veo-3.1-generate-preview }
        status: { type: string, enum: [queued, in_progress, completed, failed], description: 'Terminal states are `completed` and `failed`; a terminal job is served from storage without re-polling the provider (an expired job answers 410 rather than 200).' }
        progress: { type: integer, minimum: 0, maximum: 100, description: 'Percent complete (best effort — relayed from the provider where it reports one, synthesized for Veo).' }
        created_at: { type: integer, example: 1735689600 }
        size: { type: string, example: 1280x720 }
        seconds: { type: string, example: '8', description: 'Clip length in seconds — always a string in the response, even when the create request sent a number.' }
        prompt: { type: string }
        completed_at: { type: integer, nullable: true }
        expires_at: { type: integer, nullable: true, description: 'Provider-reported Unix time after which the job or asset may be purged. ENFORCED by the gateway: once it passes for a completed job, poll and content answer 410 and the job is marked failed with error.code="expired". Rows are never deleted, only marked.' }
        error: { allOf: [{ $ref: '#/components/schemas/VideoError' }], nullable: true, description: 'null until the job fails or expires. error.code="expired" marks a job whose artefact is gone (provider retention window passed, or the provider answered 404/410).' }
        remixed_from_video_id: { type: string, nullable: true }
    VideoList:
      type: object
      properties:
        object: { type: string, example: list }
        data:
          type: array
          description: Newest first. Page size is bounded by `limit` (default 20, max 100).
          items: { $ref: '#/components/schemas/Video' }
        has_more:
          type: boolean
          description: |
            True when at least one more (older) job exists. Pass `last_id` as the
            `after` query parameter to fetch it.
          example: false
        last_id:
          type: string
          description: |
            The id of the last job on this page; use it as the next `after`
            cursor. Omitted when the page is empty.
          example: video_abc123
    VideoDeleted:
      type: object
      properties:
        id: { type: string, example: video_abc123 }
        object: { type: string, example: video.deleted }
        deleted: { type: boolean, example: true }
    VideoError:
      type: object
      properties:
        code: { type: string, example: video_generation_failed }
        message: { type: string }
