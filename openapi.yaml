openapi: 3.0.3
info:
  title: AI Gateway
  version: 1.8.0
  description: |
    Unified AI Gateway — OpenAI / Anthropic / Responses under one domain.
    Gateway auth (/v1/* and the bare convenience aliases): `Authorization: Bearer sk-gw-…`
    or `x-api-key: sk-gw-…`. Admin (/api/*): `Authorization: Bearer <JWT>` from
    /api/auth/login, or the HttpOnly `gw_token` session cookie set by the login flows
    for dashboard-origin calls (same-origin; cross-site mutations pass CSRF origin checks).
    Errors: {error:{message,type}}. A non-2xx upstream create response on
    POST /v1/videos is re-wrapped into this envelope as
    {error:{message,type:"upstream_error",code}} after scrubbing credentials and
    bounding the length; the provider's own message is preserved.
servers:
  - url: http://localhost:8080
    description: local
  - url: https://ai.example.com
    description: production
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      tags: [ops]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: "1.7.0" }
                  db: { type: string, example: up }
                  config_ok: { type: boolean, example: true }
  /ready:
    get:
      summary: Readiness probe (Phase 2.5)
      tags: [ops]
      responses:
        '200': { description: ready }
        '503': { description: not ready }
  /api/health:
    get:
      summary: Dashboard health ping
      tags: [ops]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: "1.7.0" }
  /metrics:
    get:
      summary: Prometheus metrics exposition (admin-auth gated when METRICS_PROTECT=true)
      tags: [ops]
      responses:
        '200':
          description: prometheus exposition
          content:
            text/plain:
              schema: { type: string }
  /api/auth/login:
    post:
      summary: Admin login
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              description: Password-only bodies 401 once any dashboard user exists (usernameless login is a legacy bootstrap path only).
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: admin123 }
      responses:
        '200':
          description: JWT token (also set as the HttpOnly gw_token session cookie)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  username: { type: string }
                  role: { type: string }
        '401': { description: invalid credentials }
  /api/auth/logout:
    post:
      summary: Revoke the caller's session (token_version bump) and clear the gw_token cookie
      tags: [auth]
      responses:
        '200':
          description: logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/auth/oidc:
    post:
      summary: OIDC SSO login — verify an OIDC id_token and mint a dashboard session
      description: |
        Requires OIDC_ISSUER to be configured (503 otherwise). Roles are resolved
        server-side: existing users keep their stored role; new subjects provision as
        member unless listed in OIDC_ADMIN_SUBJECTS (comma-separated subjects auto-granted admin).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        '200':
          description: dashboard JWT (also set as the gw_token cookie)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '400': { description: invalid json or missing id_token }
        '401': { description: invalid oidc token }
        '503': { description: OIDC login not configured (set OIDC_ISSUER) }
  /api/providers:
    get:
      summary: List providers
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: list }
    post:
      summary: Create provider (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProvider' }
      responses:
        '201': { description: created }
  /api/providers/{id}:
    put:
      summary: Update a provider — credential-rotation path (audited)
      description: name, base_url and api_key are all optional; omitted fields keep their stored value.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 128 }
                base_url: { type: string, maxLength: 2048 }
                api_key: { type: string, description: "Empty/omitted keeps the stored credential" }
      responses:
        '200':
          description: updated provider (api_key masked)
        '400': { description: invalid input }
        '404': { description: not found }
    delete:
      summary: Delete provider (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: deleted }
  /api/keys:
    get:
      summary: List gateway keys
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: list }
    post:
      summary: Create gateway key (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKey' }
      responses:
        '201':
          description: created — the full sk-gw-… key is shown once
  /api/keys/{id}:
    delete:
      summary: Revoke gateway key (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: revoked }
    put:
      summary: Update key name
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: my-key }
      responses:
        '200': { description: updated }
  /api/keys/{id}/analytics:
    get:
      summary: Per-key usage analytics (range rollups, org-scoped)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 7d }
      responses:
        '200':
          description: usage rollups for one gateway key (all-time + windowed totals, time buckets, top models, endpoints, latency percentiles, error breakdown)
        '404': { description: unknown key (or other org's key) }
  /api/keys/{id}/rate-limit:
    put:
      summary: Update per-key RPM (audited, legacy)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rpm: { type: integer, example: 60 }
                rph: { type: integer, example: 1000 }
                rpd: { type: integer, example: 10000 }
                tpm: { type: integer, example: 50000 }
      responses:
        '200': { description: updated }
  /api/keys/{id}/limits:
    put:
      summary: Update per-key limits and model allowlist (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rpm: { type: integer, example: 60 }
                rph: { type: integer, example: 1000 }
                rpd: { type: integer, example: 10000 }
                tpm: { type: integer, example: 50000 }
                rate_limit_rpm: { type: integer, example: 60 }
                rate_limit_rph: { type: integer, example: 1000 }
                rate_limit_rpd: { type: integer, example: 10000 }
                rate_limit_tpm: { type: integer, example: 50000 }
                allowed_models: { type: array, items: { type: string }, example: ["gpt-4o-mini", "gpt-4*"] , description: "Allowlist with * wildcard; empty = all models" }
      responses:
        '200': { description: updated }
  /api/models/catalog:
    get:
      summary: List models catalog
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string }
        - name: reasoning
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: catalog }
  /api/models/aliases:
    get:
      summary: List aliases
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: aliases }
    post:
      summary: Create alias (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, target]
              properties:
                alias: { type: string, example: fast, pattern: '^[a-zA-Z0-9._/-]{1,64}$' }
                target: { type: string, example: openai/gpt-4o-mini }
      responses:
        '201': { description: created }
  /api/models/aliases/{alias}:
    delete:
      summary: Delete alias (audited)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: deleted }
  /api/models/settings:
    get:
      summary: Get system config
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: settings }
    put:
      summary: Upsert system-config settings (audited, admin only)
      description: |
        Body is a flat JSON map of setting key → string value (max 50 keys; keys ≤128
        chars, values ≤4096 chars). Internal keys (models_* or _*) are never stored —
        they are reported in `skipped`.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
              example:
                default_temperature: "0.7"
      responses:
        '200':
          description: saved/skip report
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: integer, example: 1, description: number of keys stored }
                  skipped:
                    type: array
                    items: { type: string }
                    description: keys rejected (internal/oversized)
                    example: ["models_last_sync"]
  /api/models/settings/{key}:
    delete:
      summary: Delete a system-config setting (audited, admin only)
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '204': { description: deleted }
        '400': { description: invalid key (internal or oversize) }
  /v1/chat/completions:
    post:
      summary: Chat completions (OpenAI compat, gateway auth)
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string, example: openai/gpt-4o-mini, description: "Prefer provider/model. Short ids still resolve." }
                messages: { type: array, items: { type: object } }
                stream: { type: boolean, default: false }
                temperature: { type: number }
      responses:
        '200': { description: completion }
        '401': { description: authentication_error }
        '429': { description: rate_limit_error }
  /v1/completions:
    post:
      summary: Completions (OpenAI compat)
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      responses:
        '200': { description: completion }
  /v1/embeddings:
    post:
      summary: Embeddings
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      responses:
        '200': { description: embeddings }
  /v1/messages:
    post:
      summary: Anthropic Messages compat
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      responses:
        '200': { description: message }
  /v1/responses:
    post:
      summary: OpenAI Responses API (native or translated)
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      responses:
        '200': { description: response }
  /v1/systemone:
    post:
      summary: System One decision-model endpoint (noul / choice / score)
      description: |
        Decision models (TypeSafe Jev, Cloudflare Clef, open-weight Kev,
        llama.cpp) read a `state` plus a map of typed `questions` and return a
        calibrated probability for every allowed answer — no text generation,
        no streaming. Routed only to decision-capable providers (types
        `systemone` / `cloudflare`, or any base URL containing `systemone` or
        `/ai/run`).

        This is a **gateway-defined** endpoint speaking the System One wire
        protocol; it is not an OpenAI API and there is no OpenAI SDK mode for it.

        Requests are validated locally before routing, so a malformed question
        fails fast with `400 invalid_request_error` naming the offending field
        (e.g. `questions.team.criteria: required map of option to description`).
        Rules enforced by the gateway:

        * `model` — required non-empty string; must resolve to a decision model.
        * `state` — required and not `null`; any other JSON value is accepted.
        * `questions` — required object, 1–64 entries. Each id must be 1–100 chars
          of `[A-Za-z0-9_.-]`; any other id is a 400 naming the id.
        * `instructions` (per question) — required, and must be a non-empty
          string, object or array. `""`, `{}` and `[]` are rejected.
        * `criteria` — **required** for `choice` (object of 2–255 non-empty
          option keys → description) and for `score` (ordered array of 2–10
          level descriptions). Optional for `noul`, where the only permitted keys
          are the literal strings `"true"` and `"false"` (a JSON object cannot
          have boolean keys).
        * `images` — optional array, at most 4 entries, each an inline data URL,
          bare base64 string or `{url,b64_json,data,mime_type}` object. Remote
          http(s) URLs are rejected. `audio` / `videos` (Clef-omni) are forwarded
          unchecked.

        Billing: input tokens only — `usage.output_tokens` is reported for shape
        compatibility and is not billed.

        **Caching:** this endpoint uses the gateway's exact-match response cache
        (default TTL `CACHE_TTL_SECONDS=10`), unlike the image endpoints. Two
        byte-identical requests within the TTL are answered from cache
        (`X-Cache: HIT`, `cost_usd=0` in the request log) with no upstream call.
        Deterministic evaluation makes this safe, but if you need a fresh
        evaluation for identical input, vary the body or the key.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, state, questions]
              properties:
                model:
                  type: string
                  example: clef
                  description: "Decision model selector (clef, clef-flash, clef-omni, kev-0.8b, kev-4b, kev-9b, kev-27b, jev-latest, laya, …). Prefer provider/model to pin a route; a model that is not a decision model is rejected with 400."
                state:
                  description: "Content to evaluate: string, object or array (records, chat logs, app state). Must be present and non-null."
                questions:
                  type: object
                  minProperties: 1
                  maxProperties: 64
                  description: "Map of question id → typed question. Ids must be 1-100 chars of [A-Za-z0-9_.-]; any other id is rejected with a 400 naming it."
                  additionalProperties:
                    type: object
                    required: [type, instructions]
                    properties:
                      type:
                        type: string
                        enum: [noul, choice, score]
                        description: "noul = yes/no (returns P(yes) in [0,1]); choice = one of N options (returns the distribution); score = ordered rubric (returns a probability-weighted score). Any other value is a 400 (unknown question type)."
                      instructions:
                        description: "Instructions for this question. String, object or array — but not empty: '', {} and [] are all rejected with 400."
                      criteria:
                        description: |
                          Per-type, and the shape differs per type. Criterion
                          *values* are not inspected by the gateway (any JSON value
                          is forwarded) — only the keys/count are validated:

                          * `choice` (REQUIRED): object mapping each option label
                            (non-empty string key) to its description, with 2–255
                            options.
                          * `score` (REQUIRED): ordered array of 2–10 levels,
                            lowest first. Levels may be strings or structured
                            objects.
                          * `noul` (optional): object whose only permitted keys are
                            the strings "true" and "false" — e.g.
                            `{"true": "it is urgent", "false": "no rush"}`.
                images:
                  type: array
                  maxItems: 4
                  items: {}
                  description: "Clef extension: at most 4 inline images. Each entry is a data URL, a bare base64 string, or an object with url/b64_json/data (+ optional mime_type/media_type). Remote http(s) URLs are rejected because the gateway does not fetch user URLs server-side."
                audio:
                  type: array
                  items: {}
                  description: "Clef-omni extension: inline audio (data URL / base64 / object). Forwarded to the provider unchecked — not validated, not counted, no gateway-side limit."
                videos:
                  type: array
                  items: {}
                  description: "Clef-omni extension: inline video (data URL / base64 / object). Forwarded to the provider unchecked — not validated, not counted, no gateway-side limit."
      responses:
        '200':
          description: Typed answers, one per question id, plus usage.
          content:
            application/json:
              schema:
                type: object
                required: [answers, usage]
                properties:
                  model: { type: string }
                  answers:
                    type: object
                    description: One entry per question id from the request.
                    additionalProperties:
                      type: object
                      properties:
                        type: { type: string, enum: [noul, choice, score] }
                        noul: { type: number, minimum: 0, maximum: 1, description: 'P(yes), present for noul questions.' }
                        choice: { type: string, description: 'The chosen option label; present for choice questions.' }
                        score: { type: number, description: 'Probability-weighted score; present for score questions.' }
                        legend: { type: object, additionalProperties: { type: string } }
                        probabilities: { type: object, additionalProperties: { type: number } }
                        confidence: { type: number, minimum: 0, maximum: 1 }
                  usage:
                    type: object
                    description: 'Always present. Decision models bill input tokens only; output_tokens is reported for shape compatibility and is not billed.'
                    properties:
                      input_tokens: { type: integer }
                      output_tokens: { type: integer }
        '400': { description: 'invalid_request_error — malformed question schema (missing/empty criteria, bad question id, empty instructions), or a model that is not a decision model' }
        '401': { description: authentication_error }
        '429': { description: rate_limit_error }
        '502': { description: proxy_error (upstream failed on every attempt) }
        '503': { description: proxy_error (no decision-capable provider configured for this model)' }
  /v1/models:
    get:
      summary: Models with id=provider/model (aliases remain bare)
      description: |
        Rows come from per-provider discovery (`provider_models`) when available,
        otherwise from the catalog. Capability fields are emitted per row:

        * `image` / `image_only` — image generation (see the images section).
        * `video` / `video_only` — video generation served by `/v1/videos`.
        * `decision` — System One decision model served by `/v1/systemone`.
        * `kind` — the capability class as a single string. A row with several
          capabilities carries the LAST one applied in the order
          `decision` → `video` → `image`, so `kind` is a label, not a list; use
          the individual booleans to test each capability.

        `image_cost` is USD per generated image and `video_cost` is USD per
        generated second; both are omitted when the curated registry has no
        price for the model.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      responses:
        '200':
          description: models
          headers:
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object]
                      properties:
                        id: { type: string, example: openai/gpt-4o-mini }
                        model_id: { type: string, example: gpt-4o-mini }
                        object: { type: string, example: model }
                        created: { type: integer }
                        owned_by: { type: string, example: openai }
                        display_name: { type: string }
                        context_window: { type: integer }
                        max_output: { type: integer }
                        input_cost: { type: number, description: USD per 1M input tokens }
                        output_cost: { type: number, description: USD per 1M output tokens }
                        reasoning: { type: boolean }
                        tool_call: { type: boolean }
                        attachment: { type: boolean }
                        reasoning_type: { type: string }
                        reasoning_levels: { type: string }
                        reasoning_output_limits: { type: string }
                        alias_target: { type: string, description: 'Set on alias rows (owned_by=gateway-alias) — the model id the alias resolves to.' }
                        decision: { type: boolean, description: 'true for System One / decision models (POST /v1/systemone).' }
                        image: { type: boolean, description: 'true for image-generation models (kind: image)' }
                        image_only: { type: boolean, description: 'true when the model generates ONLY images (no text output) — such models are refused on the chat/completions/messages/responses endpoints. false for models that also chat (e.g. Gemini image models). Derived from models.dev modalities.output.' }
                        video: { type: boolean, description: 'true for video-generation models (kind: video), served through the async /v1/videos job API' }
                        video_only: { type: boolean, description: 'true when the model generates ONLY video (no text output) — such models are refused on the chat/completions/messages/responses endpoints' }
                        video_cost: { type: number, description: 'USD per generated second of video (omitted when the curated registry has no price)' }
                        image_cost: { type: number, description: 'USD per generated image (omitted when the curated registry has no price)' }
                        modalities: { type: string, description: 'models.dev modalities JSON, e.g. {"input":["text","image"],"output":["image"]}. Emitted on rows that carry an image or video capability.' }
                        kind: { type: string, enum: [image, video, decision], description: 'Capability class; absent for a plain text model. A model with several capabilities takes the last flag applied — decision < video < image. Use the per-capability booleans to test a capability.' }
        '401': { description: authentication_error }
  /v1/models/{id}:
    get:
      summary: Retrieve one model (object/id/owned_by/created)
      description: |
        Looks the id up in `provider_models` first (bare or provider-qualified),
        then in the catalog, and returns the minimal model object. The per-key
        `allowed_models` allowlist is enforced here, so a model the key may not
        use answers **404** exactly like an unknown id.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: model object
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: model }
                  id: { type: string, example: openai/gpt-4o-mini }
                  owned_by: { type: string, example: openai }
                  created: { type: integer }
        '400': { description: invalid_request_error (model id required) }
        '401': { description: authentication_error }
        '404': { description: 'not_found_error (unknown id, or the key''s allowed_models excludes it)' }
  /v1/images/generations:
    post:
      summary: Image generation (OpenAI-compatible Images API, gateway auth)
      description: |
        Text-to-image generation. The routed provider's dialect is detected
        automatically — OpenAI/azure/openai_compatible passthrough, xAI Grok,
        Google Gemini (Nano Banana) generateContent and Imagen :predict are all
        normalized to the OpenAI Images response shape. Reference images may be
        supplied via `image` or `images` for image-to-image models.

        **Not cached.** Every request reaches the provider (a re-roll is never
        served a stale cached image), and every response is billed per generated
        image. The client-facing first-byte budget is 300s by default rather than
        the 85s chat budget (`IMAGE_TIMEOUT_SECONDS`).
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageGenerationRequest' }
      responses:
        '200':
          description: generated image(s)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagesResponse' }
        '400': { description: 'invalid_request_error (bad body, unsupported size, or a model that is not an image model)' }
        '401': { description: authentication_error }
        '429': { description: rate_limit_error }
        '502': { description: 'proxy_error (upstream failed, or returned no usable image body)' }
        '503': { description: proxy_error (no image-capable provider configured for this model) }
        '504': { description: proxy_error (the image first-byte budget expired before the provider answered) }
  /v1/images/edits:
    post:
      summary: Image edits (multipart/form-data, OpenAI-compatible)
      description: |
        Multipart image editing: one or more source files (`image`, repeatable,
        or `images`) plus an optional `mask` — at most 4 source files.
        Translated to the routed provider's edit dialect and returned in the
        OpenAI Images shape.

        **Not cached.** Every request reaches the provider, and every response is
        billed per generated image.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageEditRequest' }
      responses:
        '200':
          description: edited image(s)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagesResponse' }
        '400': { description: 'invalid_request_error (not multipart, missing model/prompt, no image part, or more than 4 source files)' }
        '401': { description: authentication_error }
        '429': { description: rate_limit_error }
        '502': { description: 'proxy_error (upstream failed, or returned no usable image body)' }
        '503': { description: proxy_error (no image-capable provider configured for this model) }
        '504': { description: proxy_error (the image first-byte budget expired before the provider answered) }
  /v1/videos:
    get:
      summary: List video jobs (OpenAI-compatible Videos API, gateway auth)
      description: |
        Returns the jobs created by the calling gateway key, newest first.
        Served purely from the `video_jobs` table — it never calls the provider,
        so a live job's status in the list can lag the provider until that job is
        polled via `GET /v1/videos/{id}`.

        **Pagination** follows the OpenAI list convention. `limit` defaults to 20
        and is clamped to 100; pass the returned `last_id` as `after` to fetch the
        next (older) page. `has_more` is truthful — the gateway reads one row past
        the page to decide it rather than running a separate COUNT.

        Dashboard sessions (`gw_token` / JWT) see every job; gateway keys see only
        their own. A job whose owning provider key has been removed is not visible
        to any key. Expired jobs are eventually removed by the gateway's retention
        sweep; until then they are reported with `error.code: "expired"` once the
        expiry has been observed.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1..100. Values above 100 are clamped; a value below 1 or a non-integer is a 400.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: after
          in: query
          required: false
          description: |
            Cursor: the `id` of the last job on the previous page. Returns jobs
            older than that one. Must be a job owned by the calling key — anything
            else is a 400 (a foreign id is not accepted, so job ids cannot be
            probed).
          schema: { type: string }
      responses:
        '200':
          description: video job list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoList' }
        '400': { description: 'invalid_request_error (bad limit, or an `after` cursor not owned by this key)' }
        '401': { description: authentication_error }
        '500': { description: proxy_error (the job rows could not be read) }
    post:
      summary: Create a video generation job (OpenAI-compatible, async)
      description: |
        **Async lifecycle: create → poll → content.**

        1. `POST /v1/videos` enqueues the work upstream and returns immediately
           with a job in status `queued`. It never waits for the render.
        2. Poll `GET /v1/videos/{id}` until `status` is `completed` or `failed`.
           Each poll of a live job is exactly one upstream poll — the gateway runs
           no background poller, so a client that stops polling costs nothing. A
           transient upstream failure while polling serves the last known state
           with `200` rather than an error. A terminal job is served from storage
           without touching the provider.
        3. Fetch the bytes from `GET /v1/videos/{id}/content` (`video/mp4`).

        The routed provider's dialect is detected automatically — OpenAI-compatible
        `/v1/videos` passthrough, xAI Grok Imagine (`/v1/videos/generations` →
        `request_id`) and Google Veo (`:predictLongRunning` → operation polling) are
        all normalized to the OpenAI Videos shape (xAI's `done` becomes `completed`).

        **Billing** happens once, at enqueue, priced per generated second from the
        requested duration — the provider has already been asked to render, so a
        job that is never polled or that later fails is still billed.

        **Generated media is not cached.** Nothing from this surface enters the
        response cache, and the content route streams straight from the provider on
        every call; the only state the gateway keeps is the `video_jobs` row.

        **Upstream create errors** are re-wrapped into the standard gateway
        envelope: a non-2xx create response is bounded, credential-scrubbed and
        returned as `{error:{message,type:"upstream_error",code}}` so the
        provider's own message still reaches the caller.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoCreateRequest' }
      responses:
        '200':
          description: video job created (status queued)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
        '400': { description: 'invalid_request_error (bad body, unsupported seconds/size, or a model that is an image/decision model rather than a video model)' }
        '401': { description: authentication_error }
        '429': { description: rate_limit_error }
        '500': { description: proxy_error (the job could not be persisted) }
        '502': { description: 'proxy_error (upstream create failed, or returned no job handle). A non-2xx create response is re-wrapped as an upstream_error envelope — see the description.' }
        '503': { description: 'proxy_error (no video-capable provider configured for this model, or no routing member below its OAuth quota threshold)' }
        '504': { description: proxy_error (the provider did not acknowledge the create within the video first-byte budget) }
  /v1/videos/{id}:
    get:
      summary: Retrieve a video job (OpenAI-compatible; poll until completed|failed)
      description: |
        Poll a job. A **terminal** job (`completed` / `failed`) is served from the
        `video_jobs` row without calling the provider. A **live** job triggers one
        upstream poll (bounded by the normal first-byte budget), is normalized, and
        updates the row — so repeated polls stop hitting the provider once the job
        finishes.

        A transient upstream poll failure is not surfaced: the last known state is
        returned with `200`.

        **Expiry answers `410 Gone`, and it is sticky.** Once the provider's
        advertised `expires_at` has passed — or the provider answers `404`/`410`
        for the job — the row is rewritten to `failed` with
        `error.code: "expired"` and every later poll answers `410` with the same
        message, without re-contacting the provider.

        Ownership: a dashboard session sees every job; a gateway key sees only its
        own. Anything else answers `404` (never `403`, so the endpoint does not
        confirm that an id exists).
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: current video job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Video' }
        '401': { description: authentication_error }
        '404': { description: 'not_found_error (unknown id, a job owned by another gateway key, or a provider the key''s org may not use)' }
        '410': { description: 'gone — the generated video expired: the provider''s retention window passed or the provider no longer knows the job. The row is marked failed/expired and stays 410.' }
        '502': { description: 'proxy_error (the provider that owns this job no longer exists, or its credential is unavailable)' }
    delete:
      summary: Delete a video job (OpenAI-compatible)
      description: |
        Forgets the job locally. The provider's own copy (and its expiry) is left
        alone, because not every dialect exposes a cancel — deleting a job does
        **not** refund the charge, which was taken at enqueue. Ownership matches
        the poll route; a foreign or unknown id answers `404`.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: deletion confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoDeleted' }
        '401': { description: authentication_error }
        '404': { description: not_found_error }
        '500': { description: proxy_error (the row could not be deleted) }
  /v1/videos/{id}/content:
    get:
      summary: Download generated video bytes (video/mp4)
      description: |
        Final step of the async lifecycle: create → poll → **content**. Streams the
        finished bytes with `Content-Disposition: inline` and the provider's
        `Content-Type` (defaulting to `video/mp4`).

        Only a terminal job can be downloaded. A job that is still `queued` /
        `in_progress` answers `409` naming the current status, and a `failed` job
        answers `409` carrying the provider's error message — poll
        `GET /v1/videos/{id}` first.

        **`410 Gone` when the artefact expired.** The gateway enforces the
        provider's `expires_at` (for a `completed` job) and also treats a provider
        `404`/`410` for the bytes as a terminal expiry: the row is marked
        `failed`/`expired` and every later poll and content request answers `410`
        with the same message. Nothing is retried upstream afterwards.

        **Generated media is not cached and never stored gateway-side.** Every call
        re-proxies from the provider, so availability ultimately depends on the
        provider's retention window.

        **Foreign-origin content URLs answer `302`.** If the provider hands back a
        URL not on its own origin, the gateway refuses to fetch it (it will not
        attach the provider credential to a third-party host) and redirects the
        client to that URL instead — `302` with `Location` and
        `Cache-Control: no-store`.
      tags: [gateway]
      security: [{ gatewayKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: generated video
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '302': { description: 'redirect — the content URL is on a different origin than the provider, so the client must fetch it directly. Location carries the URL; no provider credential is attached to it.' }
        '401': { description: authentication_error }
        '404': { description: 'not_found_error (unknown id, or a job owned by another gateway key)' }
        '409': { description: 'invalid_request_error — the video is not ready yet, or the job failed (the message names the current status or the provider error). Poll GET /v1/videos/{id} until completed.' }
        '410': { description: 'gone — the generated video expired (provider retention window passed, or the provider no longer retains the artefact). The job is marked failed/expired and stays 410.' }
        '502': { description: 'proxy_error (owning provider removed, credential unavailable, content URL unresolvable, or the upstream could not serve the bytes)' }
        '504': { description: 'proxy_error (the provider sent no first byte within the content first-byte budget, or the download stalled past the idle watchdog)' }

