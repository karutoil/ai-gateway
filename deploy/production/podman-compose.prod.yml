# AI Gateway — production Podman stack.
#
# The local dev gateway (./bin/gateway, port 8787) stays untouched; this stack
# is the production instance and binds host port 8090 (8080 is taken on this
# host by another service).
#
# Start:   cd deploy/production && podman compose -f podman-compose.prod.yml up -d --build
# Stop:    podman compose -f podman-compose.prod.yml down
# Logs:    podman logs -f ai-gateway-prod
#
# ── Deployment invariant: SHUTDOWN_GRACE_SECONDS >= IMAGE_TIMEOUT_SECONDS ────
# Image generation is allowed up to 300s (IMAGE_TIMEOUT_SECONDS, unset/-1 = 300,
# 0 = disabled, N = N seconds). The gateway's built-in drain window is only 90s,
# so a deploy/restart would cancel in-flight image generations: the client gets a
# 502 and the request_logs billing row is never written (the DB is closed right
# after the drain) while the provider still bills. The values below keep the
# drain window (330s) above the image budget and give the supervisor (360s) more
# than the drain window. Full rationale: deploy/README.md §1.
# cmd/gateway/main.go also logs a boot WARNING if these two env values disagree.
#
# Auto-start on reboot: install and enable deploy/systemd/ai-gateway-podman.service
# as a user service (lingering is already on for this host). It runs
# `compose up -d --build` at boot; `restart: unless-stopped` below is the
# second layer via podman-restart.service.
#   cp deploy/systemd/ai-gateway-podman.service ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user enable --now ai-gateway-podman.service
#
# ── Deploying a new build with minimal downtime ──────────────────────────────
# `compose up -d --force-recreate` recreates EVERY service in the project,
# including postgres and redis: podman-compose 1.3.0 ignores --no-deps on that
# path. A postgres restart costs ~60s of 502s because the gateway blocks on
# `depends_on: service_healthy`. When only the gateway image changed, swap the
# container directly instead (stop is ~1s when no long request is in flight):
#
#   podman create --name ai-gateway-prod-new \
#     --label io.podman.compose.project=production \
#     --label io.podman.compose.service=gateway \
#     --network production_default --network-alias gateway \
#     --env-file .env -p 8090:8090 -v $PWD/data:/data \
#     --stop-timeout 360 --restart unless-stopped localhost/ai-gateway:prod
#   podman rename ai-gateway-prod ai-gateway-prod-old
#   podman rename ai-gateway-prod-new ai-gateway-prod
#   podman stop -t 360 ai-gateway-prod-old && podman start ai-gateway-prod
#   podman rm ai-gateway-prod-old
#
# Order matters: rename first, so the only gap is stop -> start (~1s when
# idle). Do NOT pass --health-cmd here — the image already ships the right
# one. If you ever do override it, it MUST run under bash: the image has no
# curl, and `/dev/tcp` is a bash feature, so a bare CMD-SHELL string fails
# under /bin/sh with "cannot create /dev/tcp/...: Directory nonexistent" and
# the container reports unhealthy while serving fine.
#
# `podman stop` without -t uses Config.StopTimeout, which podman-compose does
# not set from `stop_grace_period` (it stays at podman's 10s default) — hence
# --stop-timeout above and -t 360 below. A stop that exceeds the app's own
# SHUTDOWN_GRACE_SECONDS is SIGKILLed, so keep -t above it.
#
# Post-swap checks: curl -s localhost:8090/health (version must be the new
# build), podman ps must say (healthy), and
# `podman exec ai-gateway-prod printenv SHUTDOWN_GRACE_SECONDS` must print a
# number.
#
# Point your Cloudflare Tunnel at http://localhost:8090.

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ai-gateway:prod
    container_name: ai-gateway-prod
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PORT: 8090
      # Postgres primary lives in this stack (host port 5434, container 5432).
      # Flip from SQLite by setting DATABASE_URL in .env to the postgres DSN.
      DATABASE_URL: ${DATABASE_URL:-/data/gateway.db}
      REDIS_URL: ${REDIS_URL:-}

      # ── Slow-endpoint knobs (invariant above) ──────────────────────────────
      # LITERAL values, not ${VAR:-default}. podman-compose 1.3.0 substitutes a
      # variable only when it is DEFINED (here: in .env, which is gitignored);
      # for an undefined name it passes the whole "${VAR:-default}" string
      # through verbatim. The Go parser then cannot read it as an integer and
      # silently falls back to its own default — 90s for the drain window —
      # which is BELOW the 300s image budget and breaks the invariant above.
      # That is exactly what production was running before this was fixed, and
      # it is invisible except for the boot WARNING in cmd/gateway/main.go.
      # Verify after any edit: podman exec ai-gateway-prod printenv SHUTDOWN_GRACE_SECONDS
      # must print a number, never "${...}".
      IMAGE_TIMEOUT_SECONDS: 300
      # Drain window: must be >= IMAGE_TIMEOUT_SECONDS (300 + 30s slack).
      SHUTDOWN_GRACE_SECONDS: 330
    volumes:
      # Migrated copy of the dev database + auto-generated key files live here.
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Explicit healthcheck (not the Dockerfile's HEALTHCHECK, which podman's
    # default OCI output format drops). /bin/bash's /dev/tcp needs no curl/wget.
    healthcheck:
      # Single CMD-SHELL string that re-invokes bash explicitly — do NOT use the
      # exec-form list (["CMD", "/bin/bash", "-c", ...]). podman-compose rewrites
      # a list-form `test:` into `/bin/sh -c <args joined with shell quoting>`,
      # which produced literally
      #   /bin/sh -c /bin/bash' '-c' 'exec 3<>/dev/tcp/...'
      # dash has no /dev/tcp, so the probe always failed and a perfectly healthy
      # gateway was reported (unhealthy) with FailingStreak climbing. The string
      # form below yields `/bin/sh -c "/bin/bash -c '...'"`, which works under
      # both podman-compose and docker compose.
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \" 200 \"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Must exceed SHUTDOWN_GRACE_SECONDS or podman SIGKILLs mid-drain.
    stop_grace_period: 360s
    restart: unless-stopped

  # Postgres primary for production + failover replica source.
  # Host port 5434 avoids the native 17/main cluster on 5433.
  # Standby connects to <main-ipv6>:5434 as user replicator.
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: ai-gateway-postgres
    ports:
      - "5434:5432"
    # NO env_file here on purpose: .env holds every gateway secret
    # (ADMIN_PASSWORD / MASTER_KEY / JWT_SECRET / provider keys); only
    # POSTGRES_* values are interpolated below, so nothing else is exposed
    # inside the container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/production/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ai-gateway-redis-prod
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
