# AI Gateway — production Podman stack.
#
# The local dev gateway (./bin/gateway, port 8787) stays untouched; this stack
# is the production instance and binds host port 8090 (8080 is taken on this
# host by another service).
#
# Start:   cd deploy/production && podman compose -f podman-compose.prod.yml up -d --build
# Stop:    podman compose -f podman-compose.prod.yml down
# Logs:    podman logs -f ai-gateway-prod
#
# Auto-start on reboot: install and enable deploy/systemd/ai-gateway-podman.service
# as a user service (lingering is already on for this host). It runs
# `compose up -d --build` at boot; `restart: unless-stopped` below is the
# second layer via podman-restart.service.
#   cp deploy/systemd/ai-gateway-podman.service ~/.config/systemd/user/
#   systemctl --user daemon-reload
#   systemctl --user enable --now ai-gateway-podman.service
#
# Point your Cloudflare Tunnel at http://localhost:8090.

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ai-gateway:prod
    container_name: ai-gateway-prod
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PORT: 8090
      # Postgres primary lives in this stack (host port 5434, container 5432).
      # Flip from SQLite by setting DATABASE_URL in .env to the postgres DSN.
      DATABASE_URL: ${DATABASE_URL:-/data/gateway.db}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Migrated copy of the dev database + auto-generated key files live here.
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # No built-in healthcheck: the image ships without curl/wget. Probe
    # GET /health or /ready from your orchestrator/monitoring instead.
    restart: unless-stopped

  # Postgres primary for production + failover replica source.
  # Host port 5434 avoids the native 17/main cluster on 5433.
  # Standby connects to <main-ipv6>:5434 as user replicator.
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: ai-gateway-postgres
    ports:
      - "5434:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/production/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: ai-gateway-redis-prod
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
