# golangci-lint configuration — small, stable, and BLOCKING at zero issues.
#
# Run:      make lint        (blocking set; prints an install hint if missing)
# Debt:     make lint-debt   (advisory full report, always exits 0)
# CI:       .github/workflows/ci.yml -> job `lint`, pinned golangci-lint v2.15.0
#
# This is a v2-format config (`version: "2"`); golangci-lint v2 refuses a v1
# config outright ("unsupported version of the configuration"). The pinned CI
# version and this file must move together.
#
# ── Why this list is short ───────────────────────────────────────────────────
# Measured on this tree (golangci-lint v2.15.0, tests included):
#
#   govet           0 issues  <- enabled
#   misspell        0 issues  <- enabled
#   staticcheck   ~28 issues  (gosimple is merged into it in v2)
#   unused        ~21 issues
#   revive       ~477 issues  (mostly unused-parameter)
#   errcheck     ~746 issues  (mostly unchecked Close/Write in tests)
#
# A gate that tolerates findings is not a gate: once `--new-from-rev` is the
# only way to stay green, new defects hide among old ones. So the blocking set
# here is exactly what the tree is clean under, and everything else is tracked
# by `make lint-debt` until the count reaches zero — then enable it here in the
# same commit that clears it. Grow the list downward; never raise a tolerance.
#
# Deliberately not on any list: funlen / gocyclo / dupl / wsl / nlreturn
# (style churn, no defect signal).

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet         # the go vet suite: real correctness checks
    - misspell      # typos in comments/strings
  exclusions:
    generated: lax
    paths:
      - internal/e2e
      - tests/live

issues:
  # Never truncate output. The expected count is zero, so these caps only matter
  # when someone breaks that — and then every finding should be visible.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  # gofmt is enforced directly and separately by CI (`gofmt -l .`) and
  # `make fmt-check`; nothing to configure here.
  enable: []
