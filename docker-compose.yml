# AI Gateway — local compose stack.
#
# Copy .env.example (or create .env) first: cp .env.example .env
# The gateway itself also auto-loads ./.env at startup, but compose passes env_file
# explicitly so container-side values win consistently.
#
# ── Deployment invariant: SHUTDOWN_GRACE_SECONDS >= IMAGE_TIMEOUT_SECONDS ────
# Image generation and video content downloads are legitimately slow: the image
# first-byte budget defaults to 300s (IMAGE_TIMEOUT_SECONDS, unset/-1 = 300,
# 0 = disabled, N = N seconds), while SHUTDOWN_GRACE_SECONDS defaults to 90s.
# A rolling deploy / `compose up` recreates the container: the orchestrator sends
# SIGTERM, the gateway drains in-flight requests for SHUTDOWN_GRACE_SECONDS, and
# anything still running when that expires is force-closed. With 90 < 300 an
# in-flight image generation dies mid-flight — the client gets a 502 and the
# request_logs billing row is lost (the DB is closed right after the drain).
#
# Keep the grace window at or above the image budget, and give the orchestrator
# at least that long before it SIGKILLs:
#     SHUTDOWN_GRACE_SECONDS=330   # 300s image budget + 30s slack
#     stop_grace_period: 360s      # compose/podman kill deadline (below)
# If you lower IMAGE_TIMEOUT_SECONDS, the grace window may come down too — never
# the other way round. cmd/gateway/main.go logs a WARNING at boot when the two
# disagree (see deploy/README.md).
#
# Optional Redis (shared cache + distributed rate limiting): uncomment the redis
# service below and set REDIS_URL in .env or uncomment the override here:
#   REDIS_URL: redis://redis:6379

services:
  gateway:
    build:
      context: .
    image: ai-gateway:local
    ports:
      # Bound to loopback: the dashboard is an admin surface and must be reached
      # through the reverse proxy/tunnel, not published on every interface.
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      PORT: 8080
      # REQUIRED: no default admin password. `.env.example` used to ship
      # `ADMIN_PASSWORD=change-me`, and because it is the first env_file it was
      # always present — `docker compose up` booted the dashboard with a known
      # password on every interface. `${VAR:?}` makes compose refuse to start
      # until the operator sets one.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (see .env.example)}
      # Production semantics: enables the password/secret strength checks and
      # disables dev-only conveniences.
      ENV: production
      # Postgres primary (recommended). Override with sqlite via
      #   DATABASE_URL=/data/gateway.db
      # in .env if you ever need the file-backed fallback.
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      # Optional shared cache / rate limiter — uncomment with the redis service:
      # REDIS_URL: redis://redis:6379

      # ── Slow-endpoint knobs (see the invariant in the header) ──────────────
      # Image first-byte budget in seconds. Tri-state:
      #   unset / -1 -> built-in default (300s)   ← recommended
      #   0          -> watchdog DISABLED (an upstream hang blocks until the
      #                 client or a proxy times out; do not use in production)
      #   N > 0      -> N seconds
      # Set explicitly here so the value is discoverable in `compose config`
      # rather than only in the binary's defaults.
      IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-300}
      # Graceful drain window. Must be >= IMAGE_TIMEOUT_SECONDS (see header).
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-330}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    # Explicit healthcheck rather than relying on the Dockerfile's HEALTHCHECK:
    # podman's default OCI output format drops that instruction, and this stack is
    # used with both runtimes. /bin/bash's /dev/tcp needs no curl/wget.
    healthcheck:
      # Single CMD-SHELL string, not the exec-form list: podman-compose rewrites
      # a list-form `test:` into `/bin/sh -c <shell-quoted args>`, which mangled
      # ["CMD", "/bin/bash", "-c", ...] into `/bin/sh -c /bin/bash' '-c' '...'`.
      # dash has no /dev/tcp, so the probe always failed. The string form works
      # under both docker compose and podman-compose.
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \" 200 \"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Give the gateway its full drain window before compose/podman SIGKILLs it.
    # Must be > SHUTDOWN_GRACE_SECONDS.
    stop_grace_period: 360s
    restart: unless-stopped

  # Postgres primary. First boot auto-creates the gateway database;
  # the gateway runs all migrations itself on startup.
  # Migrate existing SQLite data with:
  #   go run ./scripts/migrate-sqlite-pg.go ./data/gateway.db \
  #     "postgres://gateway:gateway@127.0.0.1:5433/gateway?sslmode=disable"
  postgres:
    image: docker.io/library/postgres:17-alpine
    ports:
      # Loopback only. This published 0.0.0.0:5433 with the password `gateway`,
      # i.e. an internet-reachable database for anyone who ran the documented
      # compose stack on a public host. The gateway reaches it over the compose
      # network, so host publishing exists only for psql/migration convenience.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Redis for multi-replica cache/rate-limit backends.
  # Enable by removing this comment block AND setting REDIS_URL above.
  #
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped

volumes:
  pgdata:
  redis-data:
